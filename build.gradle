plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	// Publishing plugins — declared but not applied here (apply false).
	// Applied only inside the env guards at the bottom of this file, so the
	// build is inert without ~/.gradle/gradle.properties credentials.
	id 'com.modrinth.minotaur' version '2.+' apply false
	id 'net.darkhax.curseforgegradle' version '1.3.33' apply false
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"bite" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// GameTest source set (Loom 1.17 FabricApiExtension.configureTests).
// GameTestSettings exposes Property<Boolean>/Property<String>, so values
// are set via .set(...) rather than the Groovy assignment shorthand in the brief.
fabricApi {
	configureTests {
		createSourceSet.set(true)
		modId.set("bite-gametest")
		eula.set(true)
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// Expand ${version} in the gametest source set's fabric.mod.json too.
processGametestResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

test {
	useJUnitPlatform()
}

// ---------------------------------------------------------------------------
// Publishing pipeline (debug-guarded, inert without credentials).
// Tokens live in ~/.gradle/gradle.properties (user-global, OUTSIDE the repo):
//   modrinth_token=...   curseforge_token=...
// NEVER commit tokens. Project IDs must be filled in after creating the
// Modrinth/CurseForge projects.
// ---------------------------------------------------------------------------
if (project.hasProperty('modrinth_token')) {
	apply plugin: 'com.modrinth.minotaur'
	modrinth {
		token = project.modrinth_token
		projectId = 'REPLACE_WITH_MODRINTH_ID'   // 在 Modrinth 建项目后填 slug/ID
		versionNumber = project.findProperty('mod_path_version') ?: project.version
		versionType = 'release'
		changelog = file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : 'Initial release'
		uploadFile = tasks.jar    // 26.x 用 jar（非 remapJar）
		gameVersions = ['26.2']
		loaders = ['fabric']
		dependencies { required.project 'fabric-api' }
	}
}

if (project.hasProperty('curseforge_token')) {
	apply plugin: 'net.darkhax.curseforgegradle'
	tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
		apiToken = project.curseforge_token
		projectId = '000000'      // 在 CurseForge 建项目后填数字 ID
		releaseType = 'release'
		addGameVersion '26.2'
		addModLoader 'Fabric'
		addEnvironment 'Client', 'Server'   // 2026-07 起 CF 强制环境标签
		relations { required 'fabric-api' }
		mainArtifact(tasks.jar)
	}
}
