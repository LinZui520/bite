# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# JDK pin lives in the user-global ~/.gradle/gradle.properties — a machine-
# specific path here breaks CI (GitHub runners have no Homebrew). CI installs
# its own JDK 25 via actions/setup-java in .github/workflows/build.yml.

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.0.0
group=com.eamon
archives_base_name=bite

# Dependencies
fabric_api_version=0.158.0+26.2

# Publishing — tokens are NEVER committed here. Put them in your user-global
# ~/.gradle/gradle.properties instead:
#   modrinth_token=...        (Modrinth, https://modrinth.com/settings/pats)
#   curseforge_token=...      (CurseForge, https://authors.curseforge.com/profile/me/api-tokens)
# After creating the projects, also fill in the projectId placeholders in build.gradle.
# Optional override for the published version string (defaults to `version` above):
# mod_path_version=1.0.0
