# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Pin the JVM used by Gradle to Homebrew's JDK 25.
# /usr/libexec/java_home -v 25 silently falls back to JDK 8 on this machine,
# which breaks the build (Loom 26.2 requires Java 25).
org.gradle.java.home=/opt/homebrew/opt/openjdk@25/libexec/openjdk.jdk/Contents/Home

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.0.1
group=com.eamon
archives_base_name=bite

# Dependencies
fabric_api_version=0.158.0+26.2

# Publishing — tokens are NEVER committed here. Put them in your user-global
# ~/.gradle/gradle.properties instead:
#   modrinth_token=...        (Modrinth, https://modrinth.com/settings/pats)
#   curseforge_token=...      (CurseForge, https://authors.curseforge.com/profile/me/api-tokens)
# After creating the projects, also fill in the projectId placeholders in build.gradle.
# Optional override for the published version string (defaults to `version` above):
# mod_path_version=1.0.0
